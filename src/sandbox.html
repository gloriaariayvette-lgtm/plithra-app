<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Box · Plithra</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070e;--surface:#11111c;--surface2:#171724;--border:#252535;--border2:#2e2e45;--coral:#c97b6e;--gold:#b8965a;--lavender:#8878b0;--teal:#5a9898;--text:#cec9c2;--text2:#9993a8;--muted:#5a566a;--ok:#5a9878;--warn:#b8965a;--err:#c97b6e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inconsolata',monospace;min-height:100vh}
.app{max-width:460px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{color:var(--muted);text-decoration:none;font-size:20px;padding:4px 8px}
.title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;letter-spacing:0.14em;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);transition:background .3s}
.dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.busy{background:var(--warn);box-shadow:0 0 8px var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

/* layers diagram */
.layers{position:relative;margin:4px 0 16px;padding:0}
.layer{border:1px solid var(--border);border-radius:12px;padding:9px 12px 9px 14px;position:relative;background:var(--surface)}
.layer + .layer-wrap{margin-top:-1px}
.layer-wrap{padding:8px 8px 0}
.layer-name{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.layer-sub{font-size:10px;color:var(--muted);margin-top:1px}
.layer.worm{border-color:var(--teal);background:var(--surface2)}
.layer.worm .layer-name{color:var(--teal)}
.wall{position:absolute;right:10px;top:9px;font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.wall.touched{color:var(--err);text-shadow:0 0 8px var(--err)}
.wall.open{color:var(--ok)}

/* prompt */
.prompt{display:flex;gap:8px;margin-bottom:8px}
textarea{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:11px;resize:none;min-height:46px}
textarea:focus{outline:none;border-color:var(--teal)}
.send{background:var(--teal);color:#07070e;border:none;border-radius:10px;padding:0 18px;font-family:inherit;font-weight:500;font-size:14px;letter-spacing:.05em;cursor:pointer}
.send:disabled{opacity:.4}
.controls{display:flex;gap:8px;margin-bottom:16px}
.ctl{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text2);font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px;cursor:pointer}
.ctl:active{background:var(--surface2)}
.ctl.stop{color:var(--err);border-color:#3a2530}

/* answer */
.answer{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--teal);border-radius:10px;padding:13px 15px;margin-bottom:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;min-height:40px;color:var(--text)}
.answer.empty{color:var(--muted);font-style:italic}

.section-h{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
/* tool stream */
.stream{display:flex;flex-direction:column;gap:7px}
.ev{border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--surface);font-size:12px;line-height:1.5}
.ev .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between}
.ev.tool{border-left:2px solid var(--gold)}
.ev.tool .k{color:var(--gold)}
.ev.result{border-left:2px solid var(--teal)}
.ev.out .k{color:var(--lavender)}
.ev.err{border-left:2px solid var(--err)}
.ev.err .k{color:var(--err)}
.ev code{color:var(--text);word-break:break-word;white-space:pre-wrap;display:block}
.ev .res{color:var(--text2);word-break:break-word;white-space:pre-wrap}
.empty-note{color:var(--muted);font-size:12px;font-style:italic;padding:6px 2px}
.err-banner{background:#2a1820;border:1px solid #3a2530;color:var(--coral);border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="back" href="index.html">←</a>
    <div class="title">The Box</div>
    <div class="dot" id="dot"></div>
  </div>

  <div class="err-banner" id="errBanner"></div>

  <!-- one-time setup: shown only until the bridge token is saved on this device -->
  <div id="setup" style="display:none;margin-bottom:14px">
    <div class="section-h">Connect once</div>
    <div class="prompt">
      <textarea id="tokenIn" placeholder="Paste the box's bridge token"></textarea>
      <button class="send" id="saveTok">Save</button>
    </div>
  </div>

  <!-- where it is -->
  <div class="layers" id="layers">
    <div class="layer-wrap" style="padding-top:0">
      <div class="layer"><div class="layer-name">Mac Studio</div><div class="layer-sub">the host · never shared in</div>
        <span class="wall" data-wall="studio">host ✕</span></div>
      <div class="layer-wrap">
        <div class="layer"><div class="layer-name">Softnet</div><div class="layer-sub">network wall · LAN &amp; tailnet blocked</div>
          <span class="wall" data-wall="net">lan ✕</span></div>
        <div class="layer-wrap">
          <div class="layer"><div class="layer-name">sandbox-1 · macOS VM</div><div class="layer-sub">internet open · 24 GB · 6 cpu</div>
            <span class="wall open" data-wall="internet">net ✓</span></div>
          <div class="layer-wrap">
            <div class="layer worm"><div class="layer-name">worm · Gemma 4 AEON</div>
              <div class="layer-sub" id="wormState">idle</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- speak to it -->
  <div class="prompt">
    <textarea id="prompt" placeholder="Say something to the worm in the box…"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="controls">
    <button class="ctl" id="pause">Pause</button>
    <button class="ctl" id="resume">Resume</button>
    <button class="ctl stop" id="stop">Stop VM</button>
  </div>

  <!-- what it said -->
  <div class="answer empty" id="answer">No answer yet.</div>

  <!-- what it reached for -->
  <div class="section-h">What it reached for</div>
  <div class="stream" id="stream"><div class="empty-note">Nothing yet. Tool calls it makes will appear here.</div></div>
</div>

<script src="js/sandbox.js"></script>
</body>
</html>
