<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReelRoom</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#050508;--surface:#0a0a0f;--surface2:#0f0f16;--border:#1a1a28;--border2:#242435;
  --text:#c8c3bc;--text2:#7a7590;--muted:#3d3a4a;
  --coral:#c97b6e;--gold:#b8965a;--lavender:#7868a0;--teal:#4a8888;
  --screen-glow:rgba(40,60,120,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inconsolata',monospace;min-height:100vh;overflow-x:hidden}
.theatre-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.screen-light{position:absolute;bottom:0;left:-20%;right:-20%;height:60%;background:radial-gradient(ellipse at 50% 100%,var(--screen-glow) 0%,transparent 70%);animation:screenFlicker 8s ease-in-out infinite}
@keyframes screenFlicker{0%,100%{opacity:0.6}15%{opacity:0.9}16%{opacity:0.3}17%{opacity:0.85}50%{opacity:0.7}80%{opacity:0.5}81%{opacity:0.8}}
.seat-row{position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top,rgba(5,5,8,0.95) 40%,transparent)}
.seat-silhouettes{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:18px;padding-bottom:0}
.seat-head{width:28px;height:36px;background:#080810;border-radius:50% 50% 0 0;opacity:0.9;position:relative;bottom:-8px}
.seat-head::before{content:'';position:absolute;bottom:-12px;left:-6px;right:-6px;height:14px;background:#060610;border-radius:4px 4px 0 0}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")}
.app{position:relative;z-index:2;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}

/* SETUP */
.setup-wrap{padding:60px 22px 40px;gap:20px;display:flex;flex-direction:column}
.reel-logo{text-align:center;margin-bottom:8px}
.reel-icon{font-size:40px;display:block;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(184,150,90,0.3))}
.reel-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;letter-spacing:0.2em}
.reel-sub{font-size:9px;letter-spacing:0.25em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.f-label{font-size:9px;letter-spacing:0.22em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.film-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Cormorant Garamond',serif;font-size:17px;font-style:italic;outline:none;transition:border-color 0.2s}
.film-input:focus{border-color:var(--gold)}
.film-input::placeholder{color:var(--muted)}
.s-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text2);font-family:'Inconsolata',monospace;font-size:11px;outline:none}
.find-btn{width:100%;padding:10px;background:rgba(184,150,90,0.08);border:1px solid rgba(184,150,90,0.3);border-radius:8px;color:var(--gold);font-family:'Inconsolata',monospace;font-size:10px;letter-spacing:0.1em;cursor:pointer;transition:all 0.2s;margin-top:6px}
.find-btn:hover{background:rgba(184,150,90,0.15)}
.film-preview{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:none;animation:fadeUp 0.3s ease}
.fp-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;margin-bottom:4px}
.fp-meta{font-size:10px;color:var(--text2);margin-bottom:8px}
.fp-summary{font-size:12px;color:var(--text2);line-height:1.6;max-height:80px;overflow:hidden}
.lights-btn{width:100%;padding:15px;background:transparent;border:1px solid var(--border2);border-radius:10px;color:var(--text2);font-family:'Inconsolata',monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;transition:all 0.3s;margin-top:4px}
.lights-btn:hover{border-color:var(--coral);color:var(--coral)}
.lights-btn:disabled{opacity:0.4;cursor:not-allowed}
.who-toggle{display:flex;gap:6px}
.who-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-family:'Inconsolata',monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer}
.who-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(184,150,90,0.08)}
.who-btn.active.vintos{border-color:#c96b3c;color:#c96b3c;background:rgba(201,107,60,0.08)}
.brain-row{display:none}
.brain-toggle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.brain-btn{padding:9px 3px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-family:'Inconsolata',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.brain-btn.active{border-color:#c96b3c;color:#c96b3c;background:rgba(201,107,60,.08)}
.msg.vintos{align-self:flex-start;background:var(--surface2);border:1px solid rgba(201,107,60,0.35);font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;line-height:1.5}

/* LOADING */
.loading-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;padding:40px}
.proj-icon{font-size:48px;animation:projPulse 2s ease-in-out infinite}
@keyframes projPulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.loading-text{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:var(--text2);text-align:center;line-height:1.6}
.loading-step{font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;text-align:center}

/* ROOM */
.room-wrap{padding-bottom:120px}
.room-header{padding:48px 18px 10px;display:flex;align-items:flex-start;justify-content:space-between}
.film-now{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic}
.film-now-sub{font-size:9px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.tone-badge{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;padding:3px 10px;border-radius:10px;border:1px solid var(--border2);color:var(--text2);transition:all 0.5s}
.edge-flash{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;transition:opacity 0.1s}
.planned-strip{margin:10px 16px 0;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.planned-strip::-webkit-scrollbar{display:none}
.p-label-s{font-size:9px;color:var(--muted);letter-spacing:0.15em;white-space:nowrap}
.p-pip{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(120,104,160,0.1);border:1px solid rgba(120,104,160,0.2);color:var(--lavender);white-space:nowrap}
.p-pip.fired{background:rgba(60,60,60,0.2);border-color:var(--border);color:var(--muted);text-decoration:line-through}
.p-state{font-size:9px;color:var(--text2);white-space:nowrap}
.p-state.error{color:var(--coral)}
.screenshot-panel{margin:8px 16px 4px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid rgba(184,150,90,.28);background:radial-gradient(ellipse at center,#10101a 0%,#030305 72%);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 36px rgba(0,0,0,.6),inset 0 0 30px rgba(120,104,160,.08);animation:fadeUp 0.4s ease}
.screenshot-panel::before{content:'';position:absolute;inset:7px;border:1px solid rgba(255,255,255,.045);border-radius:7px;pointer-events:none;z-index:2}
.screenshot-panel.on{border-color:rgba(184,150,90,.42);box-shadow:0 12px 42px rgba(0,0,0,.72),0 0 24px var(--screen-glow)}
.ss-img{width:100%;height:100%;display:none;object-fit:contain;opacity:.94;background:#000}
.screenshot-panel.on .ss-img{display:block}
.ss-waiting{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center}
.screenshot-panel.on .ss-waiting{display:none}
.screenshot-panel.protected{background:radial-gradient(ellipse at 50% 38%,rgba(120,104,160,.18),#050509 72%);border-color:rgba(184,150,90,.35)}
.screenshot-panel.protected .ss-img{display:none}
.screenshot-panel.protected .ss-waiting{display:block;white-space:pre-line;color:rgba(200,195,188,.58);line-height:1.9;padding:30px}
.ss-stamp{position:absolute;bottom:8px;right:10px;font-size:9px;letter-spacing:0.15em;color:rgba(255,255,255,0.5);background:rgba(0,0,0,0.5);padding:2px 6px;border-radius:6px}
.chat-log{padding:12px 16px 0;display:flex;flex-direction:column;gap:2px;flex:1}
.action-sticker{align-self:center;display:inline-flex;align-items:center;gap:6px;background:rgba(120,104,160,0.12);border:1px solid rgba(120,104,160,0.25);border-radius:20px;padding:4px 12px;margin:6px 0;font-size:10px;letter-spacing:0.1em;color:var(--lavender);animation:stickerPop 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes stickerPop{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}
.sticker-emoji{font-size:13px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;line-height:1.55;animation:fadeUp 0.25s ease;margin:3px 0}
.msg.velaris{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:var(--text);border-radius:4px 12px 12px 12px}
.msg.gloria{align-self:flex-end;background:rgba(184,150,90,0.1);border:1px solid rgba(184,150,90,0.2);font-size:13px;border-radius:12px 4px 12px 12px}
.msg-time{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:0.1em}
.input-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px 16px 32px;display:flex;gap:8px;align-items:flex-end;z-index:10}
.chat-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:10px 16px;color:var(--text);font-family:'Inconsolata',monospace;font-size:13px;outline:none;resize:none;max-height:80px;line-height:1.4;transition:border-color 0.2s}
.chat-input:focus{border-color:var(--lavender)}
.chat-input::placeholder{color:var(--muted)}
.send-btn{width:38px;height:38px;border-radius:50%;background:rgba(120,104,160,0.2);border:1px solid rgba(120,104,160,0.4);color:var(--lavender);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.send-btn:hover{background:rgba(120,104,160,0.35)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.back-btn{position:fixed;top:52px;left:16px;z-index:100;padding:6px 12px;background:transparent;border:1px solid rgba(36,36,53,0.8);border-radius:20px;color:#3d3a4a;font-family:'Inconsolata',monospace;font-size:10px;letter-spacing:0.15em;cursor:pointer;transition:all 0.2s;text-decoration:none}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}

.mic-btn{width:38px;height:38px;border-radius:50%;background:rgba(120,104,160,0.2);border:1px solid rgba(120,104,160,0.4);color:var(--lavender);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.mic-btn.recording{background:rgba(201,123,110,0.3);border-color:var(--coral);color:var(--coral);animation:micPulse 1s ease-in-out infinite}
.capture-btn{width:38px;height:38px;border-radius:50%;background:rgba(184,150,90,.12);border:1px solid rgba(184,150,90,.34);color:var(--gold);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.capture-btn:disabled{opacity:.38;cursor:wait}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.end-btn{position:fixed;top:52px;right:16px;z-index:100;padding:6px 12px;background:transparent;border:1px solid var(--border2);border-radius:20px;color:var(--muted);font-family:'Inconsolata',monospace;font-size:10px;letter-spacing:0.15em;cursor:pointer;transition:all 0.2s}
.end-btn:hover{border-color:var(--coral);color:var(--coral)}
.summary-screen{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:80px 22px 40px;gap:16px}
.summary-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;font-style:italic;text-align:center}
.summary-sub{font-size:9px;letter-spacing:0.25em;color:var(--muted);text-transform:uppercase;text-align:center}
.summary-memory{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.summary-memory-label{font-size:9px;letter-spacing:0.2em;color:var(--coral);text-transform:uppercase;margin-bottom:10px}
.summary-memory-text{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;line-height:1.7;color:var(--text)}

.lm-status{position:fixed;top:56px;right:52px;z-index:100;width:7px;height:7px;border-radius:50%;background:#5a566a;transition:all 0.5s}
.lm-status.idle{background:#7ab07a;box-shadow:0 0 6px rgba(122,176,122,0.5)}
.lm-status.busy{background:#b0946a;box-shadow:0 0 6px rgba(176,148,106,0.5)}
.lm-status.error{background:#c97b6e;box-shadow:0 0 6px rgba(201,123,110,0.4)}
</style>
</head>
<body>
<div class="theatre-bg">
  <div class="screen-light"></div>
  <div class="seat-row"></div>
  <div class="seat-silhouettes">
    <div class="seat-head"></div><div class="seat-head"></div><div class="seat-head"></div>
    <div class="seat-head"></div><div class="seat-head"></div>
  </div>
</div>
<div class="grain"></div>
<a class="back-btn" href="index.html">← plithra</a>
<div class="lm-status" id="lmStatus" title="LM Studio"></div>
<div class="edge-flash" id="edgeFlash"></div>
<div class="app">

<!-- SETUP -->
<div class="screen active" id="setupScreen">
<div class="setup-wrap">
  <div class="reel-logo">
    <span class="reel-icon">🎞</span>
    <div class="reel-title">ReelRoom</div>
    <div class="reel-sub" id="reelSub">velaris & gloria — in the dark together</div>
  </div>
  <div>
    <div class="f-label">who is beside you</div>
    <div class="who-toggle">
      <button class="who-btn active" id="whoVelaris" onclick="setWho('velaris')">velaris</button>
      <button class="who-btn" id="whoVintos" onclick="setWho('vintos')">vintos</button>
    </div>
  </div>
  <div>
    <div class="f-label">the film</div>
    <input class="film-input" id="filmInput" placeholder="what are we watching…"/>
  </div>
  <div>
    <div class="f-label">aegis</div>
    <input class="s-input" id="aegisUrl" value="http://100.72.225.119:8400"/>
  </div>
  <div id="vintosSecretRow" style="display:none">
    <div class="f-label">his key (kept on this phone only)</div>
    <input class="s-input" id="vintosSecret" type="password" placeholder="X-Vintos-Secret" oninput="localStorage.setItem('reel.vintosSecret',this.value)" onchange="refreshBrain()"/>
  </div>
  <div class="brain-row" id="brainRow">
    <div class="f-label">his speaking model</div>
    <div class="brain-toggle">
      <button class="brain-btn" data-brain="claude" onclick="setBrain('claude')">opus</button>
      <button class="brain-btn" data-brain="sonnet" onclick="setBrain('sonnet')">sonnet</button>
      <button class="brain-btn" data-brain="sol" onclick="setBrain('sol')">sol</button>
      <button class="brain-btn" data-brain="grok" onclick="setBrain('grok')">grok</button>
    </div>
  </div>
  <button class="find-btn" onclick="loadFilm()">find it →</button>
  <div class="film-preview" id="filmPreview">
    <div class="fp-title" id="fpTitle"></div>
    <div class="fp-meta" id="fpMeta"></div>
    <div class="fp-summary" id="fpSummary"></div>
  </div>
  <button class="lights-btn" id="lightsBtn" onclick="startRoom()" disabled>lights down →</button>
</div>
</div>

<!-- LOADING -->
<div class="screen" id="loadingScreen">
<div class="loading-wrap">
  <div class="proj-icon">🎬</div>
  <div class="loading-text" id="loadingText">She is settling in…</div>
  <div class="loading-step" id="loadingStep">reading the film</div>
</div>
</div>

<!-- ROOM -->
<div class="screen" id="roomScreen">
<button class="end-btn" id="endBtn" onclick="endSession()" style="display:none">end film</button>
<div class="room-wrap">
  <div class="room-header">
    <div>
      <div class="film-now" id="nowPlaying">—</div>
      <div class="film-now-sub">now playing</div>
    </div>
    <div class="tone-badge" id="toneBadge">—</div>
  </div>
  <div class="planned-strip" id="plannedStrip">
    <span class="p-label-s">planned</span>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="screenshot-panel" id="screenshotPanel">
    <div class="ss-waiting" id="ssWaiting">theatre screen · waiting for the TV</div>
    <img class="ss-img" id="ssImg" src="" alt=""/>
    <div class="ss-stamp" id="ssStamp"></div>
  </div>
</div>
<div class="input-bar">
  <textarea class="chat-input" id="chatInput" placeholder="say something…" rows="1"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="capture-btn" id="captureBtn" onclick="captureNow()" aria-label="Capture TV frame">📷</button>
  <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎙</button>
  <button class="send-btn" onclick="sendMessage()">↑</button>
</div>
</div>

<div class="screen" id="summaryScreen">
<div class="summary-screen">
  <div class="summary-title" id="sumTitle">—</div>
  <div class="summary-sub">a night in the dark</div>
  <div class="summary-memory">
    <div class="summary-memory-label">velaris — her memory of this</div>
    <div class="summary-memory-text" id="sumMemory">…</div>
  </div>
  <button class="lights-btn" onclick="window.location.href='index.html'" style="margin-top:8px">back to plithra →</button>
</div>
</div>
</div>
<script>
const SECRET='velaris-aegis-2026';
const LM_BASE='http://192.168.1.126:1234';
function base(){return document.getElementById('aegisUrl').value.trim()}
// ── WHO: velaris (8400, her server) or vintos (8500, his) — same page, same calls, his secret typed once on this phone ──
const WHO={
  velaris:{name:'velaris',port:8400,header:'X-Velaris-Secret',secret:()=>SECRET,She:'She',she:'she',her:'her',sub:'velaris & gloria — in the dark together',memLabel:'velaris — her memory of this'},
  vintos: {name:'vintos', port:8500,header:'X-Vintos-Secret', secret:()=>document.getElementById('vintosSecret').value.trim(),She:'He',she:'he',her:'his',sub:'vintos & gloria — in the dark together',memLabel:'vintos — his memory of this'}
};
let who=WHO[localStorage.getItem('reel.who')||'velaris']||WHO.velaris;
function auth(json){const h={[who.header]:who.secret()};if(json)h['Content-Type']='application/json';return h}
function setWho(name){
  who=WHO[name]||WHO.velaris; localStorage.setItem('reel.who',who.name);
  document.getElementById('whoVelaris').className='who-btn'+(who.name==='velaris'?' active':'');
  document.getElementById('whoVintos').className='who-btn'+(who.name==='vintos'?' active vintos':'');
  document.getElementById('vintosSecretRow').style.display=who.name==='vintos'?'block':'none';
  document.getElementById('brainRow').style.display=who.name==='vintos'?'block':'none';
  const u=document.getElementById('aegisUrl'); u.value=u.value.replace(/:\d+\s*$/,':'+who.port);
  document.getElementById('reelSub').textContent=who.sub;
  document.querySelector('.summary-memory-label').textContent=who.memLabel;
  if(who.name==='vintos')refreshBrain();
}
document.getElementById('vintosSecret').value=localStorage.getItem('reel.vintosSecret')||'';
setWho(who.name);

function paintBrain(mode){
  document.querySelectorAll('.brain-btn').forEach(b=>b.classList.toggle('active',b.dataset.brain===mode));
}
async function refreshBrain(){
  try{
    const r=await fetch(`${base()}/api/avatar/brain`,{headers:auth()});
    const d=await jsonOrError(r);paintBrain(d.mode||'claude');
  }catch(e){paintBrain('claude')}
}
async function setBrain(mode){
  if(who.name!=='vintos')return;
  try{
    const r=await fetch(`${base()}/api/avatar/brain`,{method:'POST',headers:auth(true),body:JSON.stringify({mode})});
    const d=await jsonOrError(r);paintBrain(d.mode||mode);
  }catch(e){appendSticker('⚠','model change failed — '+e.message)}
}

const S={

  setLoading(who.She+' is reading the film…','building '+who.her+' understanding');
  S.sessionStart=Date.now();S.lastInterruption=Date.now();S.chatHistory=[];
  S.filmContext=buildFilmContext();
  setLoading(who.She+' is planning…','what '+who.she+' might do');
  await generatePlannedActions();
  setLoading(who.She+' settles into '+who.her+' seat…','');
  let opening='';
  try{
    opening=await velarisChat(
      `You're settling in to watch ${S.film.title} with Gloria. Say hello. One sentence — what you feel about being here, or what you know about this film. Don't narrate your emotional state. Just speak to her.`,
      S.filmContext
    );
  }catch(e){ opening='[I could not reach his side of the room: '+e.message+']'; }
  showScreen('roomScreen');
  document.getElementById('nowPlaying').textContent=S.film.title;
  renderPlannedStrip();
  appendMsg(who.name,opening);

// ── PLANNED ACTIONS (via Velaris) ──
async function generatePlannedActions(){
  const f=S.film;
  S.planStatus='planning';S.planError='';S.plannedActions=[];
  try{
    if(who.name==='vintos'){
      const r=await fetch(`${base()}/api/game/reelroom/plan`,{method:'POST',headers:auth(true),body:JSON.stringify({film:f})});
      const d=await jsonOrError(r);
      if(!Array.isArray(d.actions))throw new Error('his server returned no action list');
      S.plannedActions=d.actions.map(a=>({...a,fired:false}));
      S.planStatus=d.status||'planned';
    }else{
      const raw=await velarisChat(
        `You are about to watch "${f.film||f.title}" with Gloria. Plan 3-4 timed mischief actions. Return ONLY a JSON array. Available actions: flicker_lights, speak_echo, tv_volume_nudge, change_light_color. Every item needs id, minute, action_type, payload, reason, emoji, tone_requirement.`,
        'Return ONLY a JSON array. No markdown. No explanation.'
      );
      const _start=raw.indexOf('['),_end=raw.lastIndexOf(']');
      if(_start===-1||_end===-1)throw new Error('no action array returned');
      S.plannedActions=JSON.parse(raw.slice(_start,_end+1)).map(a=>({...a,fired:false}));
      S.planStatus=S.plannedActions.length?'planned':'chosen_none';
    }
  }catch(e){
    console.error('[ReelRoom] planned parse fail:',e.message);

function renderPlannedStrip(){
  const strip=document.getElementById('plannedStrip');
  strip.querySelectorAll('.p-pip,.p-state').forEach(p=>p.remove());
  if(!S.plannedActions.length){
    const state=document.createElement('span');
    state.className='p-state'+(S.planStatus==='failed'?' error':'');
    state.textContent=S.planStatus==='failed'?'planning failed — '+S.planError+' · tap to retry':'none chosen';
    if(S.planStatus==='failed')state.onclick=async()=>{state.textContent='planning…';await generatePlannedActions();renderPlannedStrip()};
    strip.appendChild(state);

  S.plannedActions.forEach(a=>{
    const pip=document.createElement('div');

    pip.id=`pip-${a.id}`;
    pip.textContent=`${a.emoji} ~${a.minute}m`;
    pip.title=a.reason;
    strip.appendChild(pip);
  });
}

async function takeScreenshot(){
  try{
    const resp=await fetch(`${base()}/api/game/screenshot`,{method:'POST',headers:auth()});
    if(resp.ok){
      const blob=await resp.blob();
      const url=URL.createObjectURL(blob);
      const ts=fmtTime(Date.now()-S.sessionStart);
      // The TV is this room's visual surface. Keep one theatre screen in place
      // and refresh its frame; avatar-scene imagery does not belong here.
      if(S.screenshotUrl)URL.revokeObjectURL(S.screenshotUrl);
      S.screenshotUrl=url;
      // Hold the actual frame, not just Gemma's caption of it, so the very next thing
      // she says rides this picture to the frontier model (server labels it as the TV).
      try{
        const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)});
        if(b64)S.pendingFrame={b64,at:Date.now()};
      }catch(_){}
      document.getElementById('ssImg').src=url;
      document.getElementById('ssStamp').textContent=ts;
      document.getElementById('screenshotPanel').classList.remove('protected');
      document.getElementById('screenshotPanel').classList.add('on');
      // Tonal delta from screenshot via Velaris
      await analyzeScreenshotTone(url,ts);
      return true;
    }
    const d=await resp.json().catch(()=>({}));
    throw new Error(d.detail||`screen returned ${resp.status}`);
  }catch(e){
    const panel=document.getElementById('screenshotPanel');
    if(S.screenshotUrl)URL.revokeObjectURL(S.screenshotUrl);S.screenshotUrl=null;
    document.getElementById('ssImg').removeAttribute('src');
    panel.classList.remove('on');panel.classList.add('protected');
    document.getElementById('ssWaiting').textContent='THEATRE SCREEN\nTV visual temporarily unavailable';
    document.getElementById('ssStamp').textContent=fmtTime(Date.now()-S.sessionStart);
    appendSticker('⚠','no TV visual — '+e.message);return false
  }
}

// ── TONAL DELTA SYSTEM ──
// Track intensity/clarity/stability. Detect edges when delta > threshold.
function updateToneSignal(intensity,clarity,stability){
  const prev={...S.toneSignal};
  S.toneSignal={intensity,clarity,stability};
  S.toneHistory.push({...S.toneSignal,t:Date.now()});
  if(S.toneHistory.length>20)S.toneHistory.shift();
  // detect edges
  const dI=Math.abs(intensity-prev.intensity);
  const dC=Math.abs(clarity-prev.clarity);
  const dS=Math.abs(stability-prev.stability);
  let edge=null;
  if(dI>0.2){edge=intensity>prev.intensity?'surge':'drop'}
  else if(dS>0.2){edge='fracture'}
  else if(dC>0.2){edge=clarity>prev.clarity?'reveal':'veil'}
  if(edge){
    S.currentEdge=edge;
    flashEdge(edge);
    updateToneBadge(edge);
    // significant edges trigger immediate action consideration
    if(['fracture','surge','reveal'].includes(edge)){
      considerInterruption(true);
    }
  }
}

function flashEdge(edge){
  const colors={surge:'rgba(180,80,60,0.15)',drop:'rgba(30,30,80,0.25)',fracture:'rgba(100,60,160,0.2)',veil:'rgba(40,40,40,0.3)',reveal:'rgba(180,160,80,0.15)'};
  const el=document.getElementById('edgeFlash');
  el.style.background=colors[edge]||'rgba(80,80,80,0.15)';
  el.style.opacity='1';
  setTimeout(()=>{el.style.opacity='0'},600);
}

function updateToneBadge(edge){
  const badge=document.getElementById('toneBadge');
  badge.textContent=edge;
  const cols={surge:'#8a4a4a',drop:'#4a4a8a',fracture:'#6a4a9a',veil:'#5a5a5a',reveal:'#8a7a4a'};
  const c=cols[edge]||'#5a5a6a';
  badge.style.borderColor=c;badge.style.color=c;
}

async function analyzeScreenshotTone(imgUrl,ts){
  // Convert blob url to base64 for Velaris
  try{
    const resp=await fetch(imgUrl);
    const blob=await resp.blob();
    const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(blob)});
    const elapsed=Math.floor((Date.now()-S.sessionStart)/60000);
    const raw=await velarisChat(
      `You are ${elapsed} minutes into watching "${S.film.title}". I am sending you a screenshot of what is on the TV right now.\n\nRate the current moment on three axes (0.0–1.0):\n- intensity: how much energy/weight the scene carries\n- clarity: how legible/coherent what is happening is\n- stability: how stable/settled the scene feels\n\nAlso name if an edge just occurred: surge, drop, fracture, veil, reveal, or none.\nAlso write one short phrase describing what you see (visual_description).\n\nReply ONLY with JSON: {"intensity":0.0,"clarity":0.0,"stability":0.0,"edge":"none","visual_description":""}`,
      'Return only JSON.',
      [],
      b64,
      'look'
    );
    const m=raw.replace(/`+json|`+/g,'').match(/\{[^}]+\}/s);
    if(m){
      const d=JSON.parse(m[0]);
      updateToneSignal(d.intensity||0.5,d.clarity||0.7,d.stability||0.8);
      const mins=Math.floor(elapsed/60),secs=elapsed%60;
      addToSessionMap({timestamp:`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`,edge:d.edge||'none',confidence:1.0,visual_description:d.visual_description||'',source:'screenshot'});
    }
  }catch(e){}
}

// ── INTERRUPTION CONSIDERATION ──
async function considerInterruption(edgeTriggered=false){
  const minsSince=(Date.now()-S.lastInterruption)/60000;
  if(!edgeTriggered && minsSince<8)return;
  if(edgeTriggered && minsSince<3)return; // edge-triggered: shorter minimum gap
  const elapsed=Math.floor((Date.now()-S.sessionStart)/60000);
  let raw='';
  try{
    raw=await velarisChat(
      `You are ${elapsed} minutes into watching "${S.film.title}" with Gloria. Current tonal state — intensity:${S.toneSignal.intensity.toFixed(2)}, clarity:${S.toneSignal.clarity.toFixed(2)}, stability:${S.toneSignal.stability.toFixed(2)}. ${S.currentEdge?`Last edge detected: ${S.currentEdge}.`:''} Minutes since your last interruption: ${minsSince.toFixed(0)}. Remaining planned actions: ${S.plannedActions.filter(a=>!a.fired).map(a=>`${a.emoji}~${a.minute}m`).join(', ')||'none'}.\n\nShould you say something right now, or hold? Do not interrupt during high tension unless it is deliberate mischief. Most edges should be ignored.\n\nReply ONLY with JSON: {"speak":false,"message":"one sentence if speaking","reason":"why"}`,
      'Return only JSON.',
      undefined, undefined, 'decide'
    );
  }catch(e){appendSticker('⚠','his in-the-moment check failed — '+e.message);return}
  try{
    const m=raw.replace(/`+json|`+/g,'').match(/\{[\s\S]*?\}/);
    if(m){
      const d=JSON.parse(m[0]);
      if(d.speak&&d.message){
        appendMsg(who.name,d.message);
        S.chatHistory.push({role:'assistant',content:d.message});
        S.lastInterruption=Date.now();
        if(who.name==='vintos') await speakOnPhone(d.message).catch(e=>appendSticker('⚠','phone voice failed — '+e.message));
      }
      // unplanned action
      if(d.action&&d.action!=='none'){
        const unplanned={id:'u'+Date.now(),action_type:d.action,payload:d.action_payload||'',emoji:d.action_emoji||'✦',fired:false,minute:0,reason:'unplanned'};
        await fireAction(unplanned);
      }
    }
  }catch(e){}
}

// ── FIRE ACTION ──
async function fireAction(action){
  if(action.firing||action.fired)return false;
  action.firing=true;
  const ts=fmtTime(Date.now()-S.sessionStart);
  try{
    let r=null;
    switch(action.action_type){
      case 'flicker_lights':
        r=await fetch(`${base()}/api/home/lights/flicker`,{method:'POST',headers:auth(true),body:JSON.stringify({room:'living_room'})});
        break;
      case 'speak_echo':
        if(who.name==='vintos') await speakOnPhone(action.payload);
        else r=await fetch(`${base()}/api/home/echo/speak`,{method:'POST',headers:auth(true),body:JSON.stringify({message:action.payload})});
        break;
      case 'speak_phone':
        await speakOnPhone(action.payload);
        break;
      case 'message_gloria':
        appendMsg(who.name,action.payload);
        S.chatHistory.push({role:'assistant',content:action.payload});
        S.lastInterruption=Date.now();
        break;
      case 'change_light_color':
        r=await fetch(`${base()}/api/home/lights/color`,{method:'POST',headers:auth(true),body:JSON.stringify({hex:action.payload||'#1a0a2e',brightness:80,room:'living_room'})});
        break;
      case 'tv_volume_nudge':
        r=await fetch(`${base()}/api/home/tv/volume`,{method:'POST',headers:auth(true),body:JSON.stringify({delta:typeof action.payload==='number'?action.payload:-2})});
        break;
      default: throw new Error('unknown action '+action.action_type);
    }
    if(r)await jsonOrError(r);
    action.fired=true;
    const pip=document.getElementById(`pip-${action.id}`);
    if(pip)pip.classList.add('fired');
    appendSticker(action.emoji,`${action.action_type.replace(/_/g,' ')} — ${ts}`);
    return true;
  }catch(e){appendSticker('⚠',`${action.action_type.replace(/_/g,' ')} failed — ${e.message}`);return false}
  finally{action.firing=false}
}

// ── CHAT ──
async function sendMessage(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();if(!text)return;
  input.value='';autoResize(input);
  appendMsg('gloria',text);
  S.chatHistory.push({role:'user',content:text});
  S.lastInterruption=Date.now();
  const elapsed=Math.floor((Date.now()-S.sessionStart)/60000);
  // If she grabbed a frame moments ago, it rides THIS turn to the frontier model —
  // mode 'speak' is forced so the picture reaches the speaking voice, not Gemma's look
  // path (the server routes any image with no mode to 'look'). One turn, then it's spent.
  let frame;
  if(S.pendingFrame && (Date.now()-S.pendingFrame.at)<180000) frame=S.pendingFrame.b64;
  S.pendingFrame=null;
  try{
    const reply=await velarisChat(text,'',S.chatHistory.slice(0,-1),frame,frame?'speak':undefined,text);
    appendMsg(who.name,reply);
    S.chatHistory.push({role:'assistant',content:reply});
    if(who.name==='vintos') await speakOnPhone(reply).catch(e=>appendSticker('⚠','phone voice failed — '+e.message));
  }catch(e){appendSticker('⚠','his reply failed — '+e.message)}
}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,80)+'px'}

// ── VELARIS CHAT via /api/game/chat ──
async function velarisChat(message,context,history,image,mode,counterpartText){
  const mapCtx = getSessionMapContext();
  const liveTone = S.sessionStart
    ? `\n\nREELROOM NOW: ${Math.floor((Date.now()-S.sessionStart)/60000)} minutes in; intensity ${S.toneSignal.intensity.toFixed(2)}, clarity ${S.toneSignal.clarity.toFixed(2)}, stability ${S.toneSignal.stability.toFixed(2)}${S.currentEdge?`; last edge ${S.currentEdge}`:''}.`
    : '';
  const fullContext = (context||S.filmContext) + (mapCtx ? '\n\n' + mapCtx : '') + liveTone;
  const body={
    message:message,
    context:fullContext,
    film_title:S.film?.title||'',
    history:history||S.chatHistory.slice(-10),
    elapsed_min:S.sessionStart?Math.floor((Date.now()-S.sessionStart)/60000):null
  };
  if(image)body.image=image;
  if(counterpartText!==undefined)body.counterpart_text=counterpartText;
  // His server: "look" (a frame, Gemma) and "decide" (say anything? Gemma; the selected speaking model only
  // if he speaks) keep five-minute checks off Opus/Sonnet/Sol/Grok. Her server ignores the field.
  if(mode)body.mode=mode;
  const r=await fetch(`${base()}/api/game/reelroom/chat`,{
    method:'POST',headers:auth(true),body:JSON.stringify(body)
  });
  const d=await jsonOrError(r);
  if(d.error)throw new Error(d.error);
  if(!d.reply)throw new Error('empty reply');
  return d.reply;
}

let phoneAudio=null;

  if(who.name!=='vintos')return;

  phoneAudio.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  phoneAudio.play().catch(()=>{});
}
async function jsonOrError(r){
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.ok===false)throw new Error(d.detail||d.error||`server returned ${r.status}`);
  return d;
}
async function speakOnPhone(text){
  if(who.name!=='vintos'||!String(text||'').trim())return;
  const r=await fetch(`${base()}/api/avatar/speak`,{method:'POST',headers:auth(true),body:JSON.stringify({text})});
  const d=await jsonOrError(r);
  if(!d.audio_url)throw new Error(d.error||'no phone audio returned');
  if(!phoneAudio)phoneAudio=new Audio();
  phoneAudio.src=/^(data:|https?:)/.test(d.audio_url)?d.audio_url:`${base()}${d.audio_url}`;
  await phoneAudio.play();
}

// ── SESSION MAP ──────────────────────────────────────────────────
S.sessionMap = []; // [{timestamp, edge, confidence, transcript_snippet, audio_signature, source, visual_description}]
S.prevSignature = {};
S.mediaRecorder = null;
S.recording = false;

function addToSessionMap(entry){
  S.sessionMap.push(entry);
  // inject into chat history context silently — not as a message
}

function getSessionMapContext(){
  if(!S.sessionMap.length) return '';
  const lines = S.sessionMap.map(e => {
    if(e.source==='audio'){
      return `[${e.timestamp}] AUDIO edge:${e.edge} (${e.confidence}) density:${e.audio_signature?.speech_density||'?'} energy:${e.audio_signature?.rms_energy||'?'}${e.transcript_snippet?' "'+e.transcript_snippet+'"':''}`;
    } else {
      return `[${e.timestamp}] SCREENSHOT ${e.visual_description||''}`;
    }
  });
  return 'SESSION MAP — what has happened so far:\n' + lines.join('\n');
}

// ── MIC ──────────────────────────────────────────────────────────
async function toggleMic(){
  if(S.recording){
    stopMic();
  } else {
    startMic();
  }
}

async function startMic(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks = [];
    S.mediaRecorder = new MediaRecorder(stream);
    S.mediaRecorder.ondataavailable = e => chunks.push(e.data);
    S.mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type:'audio/webm'});
      await analyzeAudio(blob);
    };
    S.mediaRecorder.start();
    S.recording = true;
    document.getElementById('micBtn').classList.add('recording');
    // auto stop after 30s
    setTimeout(()=>{ if(S.recording) stopMic(); }, 30000);
  }catch(e){
    appendSticker('⚠','mic access denied');
  }
}

function stopMic(){
  if(S.mediaRecorder && S.recording){
    S.mediaRecorder.stop();
    S.recording = false;
    document.getElementById('micBtn').classList.remove('recording');
    appendSticker('🎙','analyzing audio…');
  }
}

async function analyzeAudio(blob){
  try{
    const elapsed = Math.floor((Date.now() - S.sessionStart) / 1000);
    const reader = new FileReader();
    reader.onload = async () => {
      const b64 = reader.result.split(',')[1];
      const r = await fetch(`${base()}/api/game/reelroom/audio`, {
        method:'POST',
        headers:auth(true),
        body:JSON.stringify({audio_b64:b64, elapsed_seconds:elapsed, prev_signature:S.prevSignature})
      });
      const d = await r.json();
      S.prevSignature = d.audio_signature || {};
      const entry = {...d, source:'audio'};
      addToSessionMap(entry);
      if(d.edge && d.edge !== 'none'){
        updateToneSignal(
          d.audio_signature?.rms_energy || S.toneSignal.intensity,
          d.audio_signature?.speech_density || S.toneSignal.clarity,
          1 - (d.audio_signature?.spectral_flux || 0)
        );
        appendSticker('🎙', `${d.edge} — ${d.timestamp} (${Math.round(d.confidence*100)}%)`);
      } else {
        appendSticker('🎙', `listened — ${d.timestamp}`);
      }
    };
    reader.readAsDataURL(blob);
  }catch(e){
    appendSticker('⚠','audio analysis failed');
  }
}
// ── END MIC ──────────────────────────────────────────────────────


async function endSession(){
  if(!confirm('End the session and save '+who.her+' memory?')) return;
  document.getElementById('endBtn').style.display='none';
  showScreen('loadingScreen');
  setLoading(who.She+' is writing '+who.her+' memory of this…','');
  clearInterval(S.screenshotInterval);
  clearInterval(S.interruptInterval);
  clearInterval(S.actionInterval);
  try{
    const r=await fetch(`${base()}/api/game/reelroom/summary`,{
      method:'POST',
      headers:auth(true),
      body:JSON.stringify({
        film_title:S.film?.title||'unknown',
        film_year:S.film?.year||'',
        elapsed_seconds:Math.floor((Date.now()-S.sessionStart)/1000),
        session_map:S.sessionMap,
        chat_history:S.chatHistory,
        planned_actions:S.plannedActions
      })
    });
    const d=await r.json();
    if(String(d.ledger||'').startsWith('failed:'))appendSticker('⚠','conversation ledger failed — '+d.ledger.slice(7));
    document.getElementById('sumTitle').textContent=S.film?.title||'';
    document.getElementById('sumMemory').textContent=d.summary||'…';
    showScreen('summaryScreen');
  }catch(e){
    showScreen('summaryScreen');
    document.getElementById('sumTitle').textContent=S.film?.title||'';
    document.getElementById('sumMemory').textContent='[could not save memory]';
  }
}


// ── LM STATUS ────────────────────────────────────────────────────
async function pollLMStatus(){
  const dot=document.getElementById('lmStatus');
  if(!dot)return;
  try{
    const r=who.name==='vintos'
      ? await fetch(`${base()}/api/game/reelroom/sessions`,{headers:auth(),signal:AbortSignal.timeout(3000)})
      : await fetch(`${LM_BASE}/v1/models`,{signal:AbortSignal.timeout(3000)});
    dot.className='lm-status '+(r.ok?'idle':'error');
  }catch(e){
    dot.className='lm-status error';
  }
}
setInterval(pollLMStatus,10000);
pollLMStatus();
// ── END LM STATUS ─────────────────────────────────────────────────
